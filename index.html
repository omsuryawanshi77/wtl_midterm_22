<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor-Mentee Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            color: #333;
        }

        header {
            background-color: #f4f6f8;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        h1, h2 {
            margin-top: 10px;
        }

        #statusMessage {
            display: none;
            padding: 12px;
            margin: 15px 0;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            font-weight: bold;
        }

        form {
            background-color: #fafafa;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            opacity: 0.7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
            vertical-align: middle;
        }

        th {
            background-color: #f2f2f2;
        }

        .mentor-photo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ccc;
        }

        dialog {
            width: 400px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>Mentor Management System</h1>
    </header>

    <div id="statusMessage"></div>
    <hr>

    <h2>Add Mentor</h2>
    <form id="addMentorForm" action="#" method="POST" enctype="multipart/form-data">
        <label>Mentor Name:</label>
        <input type="text" id="add_name" name="name" required>

        <label>Employee ID:</label>
        <input type="text" id="add_emp_id" name="emp_id" required>

        <label>Department:</label>
        <select id="add_department" name="department" required>
            <option value="">Select Department</option>
            <option value="Computer Engineering">Computer Engineering</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics & Telecom">Electronics & Telecom</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
        </select>

        <label>Designation:</label>
        <input type="text" id="add_designation" name="designation" required>

        <label>Max Mentees Allowed:</label>
        <input type="number" id="add_max_mentees" name="max_mentees" required min="1">

        <label>Profile Photo:</label>
        <input type="file" id="add_photo" name="photo" accept="image/*" required>

        <button type="submit" id="submitBtn" disabled>Submit</button>
    </form>
    <hr>

    <h2>Mentor Records</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Employee ID</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Max Mentees</th>
                <th>Photo</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="mentorTableBody"></tbody>
    </table>

    <dialog id="editModal">
        <h3>Edit Mentor</h3>
        <form id="editMentorForm" enctype="multipart/form-data">
            <input type="hidden" id="edit_id" name="id">

            <label>Mentor Name:</label>
            <input type="text" id="edit_name" name="name" required>

            <label>Employee ID:</label>
            <input type="text" id="edit_emp_id" name="emp_id" required>

            <label>Department:</label>
            <select id="edit_department" name="department" required>
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics & Telecom">Electronics & Telecom</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
            </select>

            <label>Designation:</label>
            <input type="text" id="edit_designation" name="designation" required>

            <label>Max Mentees Allowed:</label>
            <input type="number" id="edit_max_mentees" name="max_mentees" required min="1">

            <label>New Profile Photo (Optional):</label>
            <input type="file" id="edit_photo" name="photo" accept="image/*">

            <button type="submit">Update</button>
            <button type="button" id="closeModalBtn" style="background-color: #6c757d;">Cancel</button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
